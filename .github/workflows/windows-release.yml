name: Build e release para Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão do build manual"
        required: true
        default: "0.1.2"
  push:
    branches:
      - "main"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Instalar dependências
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-build.txt

      - name: Executar testes
        run: python -m unittest discover -s tests -v

      - name: Definir versão
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $BuildVersion = "${{ github.ref_name }}".TrimStart("v")
          } elseif ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $BuildVersion = "${{ inputs.version }}"
          } else {
            $BuildVersion = (& python -c "from version import __version__; print(__version__)").Trim()
          }
          "value=$BuildVersion" >> $env:GITHUB_OUTPUT

      - name: Gerar aplicativo
        run: |
          python packaging/prepare_icon.py
          python packaging/generate_build_metadata.py --version "${{ steps.version.outputs.value }}" --repository "${{ github.repository }}" --publisher "E-Lopes"
          python -m PyInstaller --clean --noconfirm DiagramExtractor.spec

      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Gerar instalador
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.version.outputs.value }}" "/DMyAppPublisher=E-Lopes" "/DMyAppURL=https://github.com/${{ github.repository }}" "packaging\installer.iss"'

      - name: Guardar instalador como artefato
        uses: actions/upload-artifact@v4
        with:
          name: ChessBookDiagramExtractor-Windows-${{ steps.version.outputs.value }}
          path: release/ChessBookDiagramExtractor-Setup-v${{ steps.version.outputs.value }}.exe
          if-no-files-found: error

      - name: Publicar GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: release/ChessBookDiagramExtractor-Setup-v${{ steps.version.outputs.value }}.exe
          generate_release_notes: true
